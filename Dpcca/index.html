<style>

  .modal-overlay { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: rgba(92,74,61,.35); }
  .modal-overlay.show { display: flex; animation: fadeIn .25s ease; }
  .modal { width: min(860px, 94vw); max-height: 90vh; overflow-y: auto; animation: slideUp .35s cubic-bezier(.16,1,.3,1); }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes confetti-fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
  /* 弃番评论区出现时的平滑入场 */
  @keyframes dropIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .drop-in { animation: dropIn .24s ease both; }

  .star { cursor: pointer; font-size: 26px; color: #d9cbb4; transition: all .2s ease; }
  .star.active { color: var(--warn); }
  .star:hover { transform: scale(1.15); }
  .star.half { color: transparent; background: linear-gradient(90deg, var(--warn) 50%, #d9cbb4 50%); -webkit-background-clip: text; background-clip: text; }
  .half-star { display: inline-block; color: transparent; background: linear-gradient(90deg, currentColor 50%, #d9cbb4 50%); -webkit-background-clip: text; background-clip: text; }
  .star-hint { color: #c8a25c; font-weight: 800; font-size: 15px; margin-left: 10px; align-self: center; white-space: nowrap; text-shadow: 0 0 10px rgba(192,154,91,.35); }

  .confetti { position: fixed; top: -20px; width: 10px; height: 18px; z-index: 300; pointer-events: none; animation: confetti-fall 3s ease-in forwards; }

  .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 500; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .toast { padding: 12px 22px; border-radius: 10px; background: #fffdf8; border: 1px solid var(--border); box-shadow: var(--shadow); font-size: 14px; color: var(--text); animation: slideUp .3s ease; }
  .toast.error { border-color: rgba(176,106,90,.5); color: var(--err); }
  .toast.ok { border-color: rgba(125,143,105,.5); color: var(--ok); }

  .ep-check { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #d9cbb4; cursor: pointer; display: flex; align-items: center; justify-content: center; color: transparent; transition: all .2s; flex: none; background: #fffdf8; }
  .ep-check.on { background: #a5b28a; border-color: transparent; color: #fff; }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }

  /* 一图流分享卡片 */
  #shareCard {

  #shareCard h2 { font-size: 22px; margin-top: 14px; }
  #shareCard .meta { font-size: 12px; color: var(--muted); margin: 6px 0 12px; }
  #shareCard .share-desc { font-size: 12px; line-height: 1.7; color: #7a6857; margin: 10px 0; }

  #shareCard .share-section { background: #efe7d9; border-radius: 12px; padding: 12px; margin-bottom: 10px; }

  #shareCard .share-score-row:last-child { margin-bottom: 0; }
  #shareCard .share-comment { color: #7a6857; }
  #shareCard .share-ep-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  #shareCard .share-ep-chip { background: rgba(255,255,255,.45); border-radius: 8px; padding: 5px 8px; font-size: 11px; line-height: 1.5; }

  /* 我的追番一图流已迁移至 profile.html */
  .pf-del { flex: none; width: 30px; height: 30px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: #a8988a; cursor: pointer; transition: all .2s; border: 1px solid transparent; }
  .pf-del:hover { color: #e05252; background: rgba(224,82,82,.12); border-color: rgba(224,82,82,.35); }
  .pf-btn { padding: 4px 11px; border-radius: 999px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); color: var(--muted); background: transparent; transition: all .2s; white-space: nowrap; }
  .pf-btn:hover { border-color: var(--warn); color: var(--warn); }
  .pf-btn.on { border-color: var(--warn); color: var(--warn); background: rgba(192,154,91,.12); font-weight: 700; }
  .pf-del-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; color: #fff; background: linear-gradient(135deg,#d9534f,#b54540); cursor: pointer; border: none; transition: all .2s; box-shadow: 0 4px 14px rgba(185,69,64,.3); }
  .pf-del-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(185,69,64,.4); }
  .pf-filter-bar { margin-bottom: 12px; padding: 12px 14px; border: 1px dashed var(--border); border-radius: 14px; background: rgba(0,0,0,.02); }

  /* 卡片状态下拉菜单 */
  .card-status-btn { cursor: pointer; user-select: none; }

  .status-menu { position: fixed; z-index: 400; min-width: 150px; background: #fffdf8; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(92,74,61,.15); padding: 5px; display: none; }

    .nav > div > div:first-child { min-width: 0; }

    /* 分享卡片自适应，避免横向溢出 */

    /* 弹窗内边距紧凑 */

<script>
/* ============================================================
 * 数据层 dataProvider —— 业务层与存储完全解耦
 * USE_CLOUD = true 时使用腾讯云开发文档型数据库（需登录态）
 * ============================================================ */
/* 用 var 声明：顶层 const 不会挂到 window，会导致外部脚本读 window.dataProvider 拿不到 */
var dataProvider = {
  USE_CLOUD: true,
  ENV_ID: "dpcca-wiki-d7g0dl19y23cd30f3",
  _ls: {
    get(key, def) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
    set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} },
    del(key) { try { localStorage.removeItem(key); } catch (e) {} },
  },
  /* 本地存储实现 */
  _local: {
    loadUserData() { return dataProvider._ls.get("dpcca_user_data", {}); },
    saveUserData(data) { dataProvider._ls.set("dpcca_user_data", data); return true; },
    initAnimeData() { return ANIME_LIBRARY; },
    loadAnimeLibrary() { return ANIME_LIBRARY; },
  },
  /* 云端实现（腾讯云开发文档型数据库） */
  _cloud: {
    _app: null, _auth: null, _db: null,
    async _getDB() {
      if (this._db) return this._db;
      if (typeof cloudbase === "undefined") throw new Error("未引入 @cloudbase/js-sdk，请先引入 SDK");
      this._app = cloudbase.init({ env: dataProvider.ENV_ID });
      this._auth = this._app.auth({ persistence: "local" });
      if (!this._auth.hasLoginState()) {
        await this._auth.anonymousAuthProvider().signIn();
      }
      this._db = this._app.database();
      return this._db;
    },
    async _uid() {
      await this._getDB();
      return (this._auth.currentUser && this._auth.currentUser.uid) || "";
    },
    /* 与 profile.html / rating.html 保持同一策略：
     * 用户追番数据统一收口到「身份文档」：where({_openid}) 命中的文档为唯一读写目标
     * （update 优先、add 兜底）。不再创建 doc("u"+uid) 主文档，避免主文档与身份
     * 文档并存造成“保存成功、刷新回弹”的分叉问题。 */
    _errText(e) {
      if (!e) return "";
      return String(e.errMsg || e.message || e.errCode || e.code || "").slice(0, 120);
    },
    _docOf(res) {
      if (!res) return null;
      let d = res.data;
      if (Array.isArray(d)) d = d[0] || null;
      return (d && typeof d === "object") ? d : null;
    },
    async loadUserData() {
      const db = await this._getDB();
      const col = db.collection("user_anime");
      // 唯一收口：身份文档 = where({_openid}) 命中的文档（账号 uid / 游客匿名 uid 的
      // _openid 均由服务端注入；占位符 {openid} 展开为当前调用者 openid，与安全规则对齐）。
      // 优先取含非空 data 的文档，兼容早期 add 产生的多条记录。
      try {
        const res = await col.where({ _openid: "{openid}" }).get();
        const list = (res && res.data) || [];
        const item = list.find(x => x && x.data && typeof x.data === "object" && Object.keys(x.data).length) || list[0];
        return (item && item.data) || {};
      } catch (e) { return {}; }
    },
    async saveUserData(data) {
      const db = await this._getDB();
      const col = db.collection("user_anime");
      const uid = (this._auth.currentUser && this._auth.currentUser.uid) || "";
      // 写入前做深拷贝快照：防止 await 期间 userData 被后续操作修改而写进中间态
      let payload;
      try { payload = JSON.parse(JSON.stringify(data)); }
      catch (e) { payload = data; }
      const errors = [];
      // 1) 身份文档存在则定点 update（与 loadUserData 同源，保证读写目标一致）
      try {
        const res = await col.where({ _openid: "{openid}" }).get();
        const list = (res && res.data) || [];
        const item = list.find(x => x && x.data && typeof x.data === "object" && Object.keys(x.data).length) || list[0];
        if (item && item._id) {
          await col.doc(item._id).update({ data: payload });
          return true;
        }
      } catch (e) { errors.push("身份文档更新失败: " + this._errText(e)); }
      // 2) 兜底：add 创建（服务端自动注入 _openid = 当前 openid）
      try {
        const a = await col.add({ data: payload, userId: uid });
        if (!a || !a.id) throw new Error("云端创建失败");
        return true;
      } catch (e) { errors.push("云端创建失败: " + this._errText(e)); }
      throw new Error(errors.join(" | ") || "云端保存失败");
    },
    /* 兼容历史数据：早期写入可能把番剧包在 data 字段里，统一解包为扁平结构 */
    _normalizeAnime(list) {
      return list.map(r => {
        if (r && typeof r === "object" && r.data && typeof r.data === "object" && !r.title && r.data.title) {
          return Object.assign({ _id: r._id }, r.data);
        }
        return r;
      });
    },
    /* 分页拉取全量番剧（Web SDK 单次 get() 最多返回 100 条，limit 最大 1000） */
    async _fetchAllAnime() {
      const db = await this._getDB();
      const PAGE = 1000;
      let skip = 0;
      let all = [];
      while (true) {
        const res = await db.collection("anime_library").orderBy("id", "asc").skip(skip).limit(PAGE).get();
        const list = res.data || [];
        all = all.concat(list);
        if (list.length < PAGE) break;
        skip += PAGE;
      }
      return all;
    },
    async initAnimeData() {
      const list = this._normalizeAnime(await this._fetchAllAnime());
      if (list.length) return list;
      throw new Error("云端番剧库为空");
    },
    async loadAnimeLibrary() {
      return this._normalizeAnime(await this._fetchAllAnime());
    },
  },
  /* 统一入口：根据 USE_CLOUD 路由 */
  async loadUserData() { return this.USE_CLOUD ? this._cloud.loadUserData() : this._local.loadUserData(); },
  async saveUserData(data) { return this.USE_CLOUD ? this._cloud.saveUserData(data) : this._local.saveUserData(data); },
  async initAnimeData() { return this.USE_CLOUD ? this._cloud.initAnimeData() : this._local.initAnimeData(); },
  async loadAnimeLibrary() { return this.USE_CLOUD ? this._cloud.loadAnimeLibrary() : this._local.loadAnimeLibrary(); },
};

const $ = (id) => document.getElementById(id);
const QUARTERS = { 1: "1月新番", 4: "4月新番", 7: "7月新番", 10: "10月新番" };
const MONTH_LABEL = (m) => (m ? `${m}月` : "");
/* 兼容：旧数据只有 quarter，新数据含 month/day */
const monthOf = (a) => a.month || a.quarter || 1;
const dayOf = (a) => a.day || 1;
/* 季度（v3.0）：口径与后台 admin.html 完全一致（1=1月冬 / 2=4月春 / 3=7月夏 / 4=10月秋），
   直接对应数据库 anime_library 的 quarter 字段；存量数据里有部分记录的 quarter 仍写成月份值（如 7 / 10），
   统一按 1-3 / 4-6 / 7-9 / 10-12 折回季度序号后再比较，避免这部分番剧筛不出来 */
const QUARTER_LABEL = { 1: "1月（冬）", 2: "4月（春）", 3: "7月（夏）", 4: "10月（秋）" };
const normQuarter = (v) => {
  const n = Number(v);
  if (!n || n < 1) return 0;
  return n <= 4 ? n : Math.min(4, Math.ceil(n / 3));
};
const quarterOf = (a) => normQuarter(a.quarter) || normQuarter(monthOf(a));
/* 具体开播日期：1月2日·2026 */
const dateStr = (a) => `${monthOf(a)}月${String(dayOf(a)).padStart(2, "0")}日·${a.year || ""}`;
/* 每集放送日期：默认首播日 + (集号-1)*7 天；a.epDates[集号] 有值时优先（后台停播/休播调整） */
const epAirDate = (a, ep) => {
  const ov = a && a.epDates && a.epDates[ep];
  if (ov) return ov;
  const base = new Date((a.year || 2026), (monthOf(a) || 1) - 1, (dayOf(a) || 1) + (ep - 1) * 7);
  const y = base.getFullYear(), m = base.getMonth() + 1, d = base.getDate();
  return (y !== (a.year || 2026) ? y + "年" : "") + `${m}月${d}日`;
};
/* 更新星期：1-7 对应周一~周日，缺省统一为周一（1），管理员后台可修改 */
const WEEK_LABELS = { 1: "周一", 2: "周二", 3: "周三", 4: "周四", 5: "周五", 6: "周六", 7: "周日" };
const weekOf = (a) => Number(a.week) || 1;
const weekStr = (a) => WEEK_LABELS[weekOf(a)] || "周一";
/* 各集平均分 */
function epAvgOf(ud, a) {
  const epScores = (ud && ud.episodes && ud.episodes[a.id] && ud.episodes[a.id].epScores) || {};
  const vals = Object.values(epScores).map(e => e && e.score).filter(Boolean);
  if (!vals.length) return null;
  return (vals.reduce((s, v) => s + v, 0) / vals.length).toFixed(1);
}
const SOURCES = ["原创", "漫画改", "游戏改", "小说改", "动画改", "影视改"];
const sourceOf = (a) => a.source || "待定";
/* 类型（v2.0 新增）：TV动画 / 剧场版 / OVA。
 * 存量数据没有 type 字段，一律兜底视为 TV 动画；后续导入数据默认 tv。 */
const TYPES = [
  { v: "tv", label: "TV动画" },
  { v: "movie", label: "剧场版" },
  { v: "ova", label: "OVA" },
];
const typeOf = (a) => (a && a.type ? String(a.type) : "tv");
const typeLabelOf = (a) => {
  const k = typeOf(a);
  const hit = TYPES.find(t => t.v === k);
  return hit ? hit.label : k;
};

/* 柔和化渐变：与米色背景混合，避免鲜艳色块（缺字段时兜底默认色） */
function softGradient(c1, c2) {
  if (!c1 || !String(c1).startsWith("#")) c1 = "#8b7355";
  if (!c2 || !String(c2).startsWith("#")) c2 = "#b5a585";
  const mix = (hex, f) => {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.round(((n >> 16) & 255) * (1 - f) + 245 * f);
    const g = Math.round(((n >> 8) & 255) * (1 - f) + 240 * f);
    const b = Math.round((n & 255) * (1 - f) + 230 * f);
    return `rgb(${r},${g},${b})`;
  };
  return `linear-gradient(135deg, ${mix(c1, .72)}, ${mix(c2, .78)})`;
}

/* 封面渲染：有 cover 图片显示图片，无图降级为 emoji + 渐变（size 控制 emoji 字号） */
function coverHTML(a, size = "56px") {
  const e = a && a.emoji ? a.emoji : "❓";
  if (a && a.cover) {

/* 排序按钮高亮 + 方向箭头 */
function renderSortBar() {
  const fields = [
    ["open", "开播前预期分"],
    ["final", "完结评分"],
    ["ep", "各集平均分"],
    ["date", "开播时间"]
  ];
  fields.forEach(([key, label]) => {

    if (!btn) return;

/* 排序：主要=追番状态（追番中 → 已看完 → 未标记 → 已弃番）；
   次要=所选字段（默认开播前预期分）按方向排列 */
function sortAnime(list) {
  const arr = [...list];
  const statusRank = (x) => {
    const st = (userData[x.id] || {}).status;
    if (st === "watching") return 0;
    if (st === "finished") return 1;
    if (st === "abandoned") return 3;
    return 2; // 未标记 / 无状态
  };
  const dirMul = sortDir === "desc" ? 1 : -1;
  arr.sort((a, b) => {
    const ra = statusRank(a), rb = statusRank(b);
    if (ra !== rb) return ra - rb;
    if (currentSort === "date") {
      // 编码为 YYYYMMDD 保证单调，修复原 month*10+day 非单调导致的错排
      const da = (a.year || 0) * 10000 + monthOf(a) * 100 + dayOf(a);
      const db = (b.year || 0) * 10000 + monthOf(b) * 100 + dayOf(b);
      return (db - da) * dirMul;
    }
    const scoreOf = (x) => {
      const ud = userData[x.id] || {};
      if (currentSort === "open") return (ud.scores && ud.scores.open && ud.scores.open.score) || 0;
      if (currentSort === "ep") return parseFloat(epAvgOf(ud, x)) || 0;
      return (ud.scores && ud.scores.final && ud.scores.final.score) || 0;
    };
    const sa = scoreOf(a), sb = scoreOf(b);
    // 有分的永远排在没有分的前面（无论升降序），未打分的沉底
    if ((sa > 0) !== (sb > 0)) return sa > 0 ? -1 : 1;
    return (sb - sa) * dirMul;
  });
  return arr;
}

/* 分页控件 */
function renderPagination(total, totalPages) {
  const el = $("pagination");
  if (totalPages <= 1) { el.innerHTML = ""; return; }
  let h = `<div class="flex flex-wrap items-center justify-center gap-2">
    <span class="text-xs text-gray-400 mr-1">共 ${total} 部 · 第 ${currentPage}/${totalPages} 页</span>
    <button class="btn btn-ghost" ${currentPage === 1 ? "disabled" : ""} onclick="goPage(${currentPage - 1})"><i class="fa-solid fa-chevron-left"></i></button>`;
  const set = new Set([1, 2, totalPages - 1, totalPages, currentPage - 1, currentPage, currentPage + 1].filter(n => n >= 1 && n <= totalPages));
  const nums = [...set].sort((a, b) => a - b);
  let prev = 0;
  for (const n of nums) {
    if (n - prev > 1) h += '<span class="text-gray-500 text-sm px-1">…</span>';
    h += `<button class="btn ${n === currentPage ? "btn-primary" : "btn-ghost"}" onclick="goPage(${n})">${n}</button>`;
    prev = n;
  }
  h += `<button class="btn btn-ghost" ${currentPage === totalPages ? "disabled" : ""} onclick="goPage(${currentPage + 1})"><i class="fa-solid fa-chevron-right"></i></button></div>`;
  el.innerHTML = h;
}

function goPage(p) { currentPage = p; renderGrid(); window.scrollTo({ top: 0, behavior: "smooth" }); }

function filteredAnime() {
  return library.filter(a => {
    // 月份与季度同属「开播时间」维度：两者都选中时取并集（任一命中即通过）
    if (selectedMonths.size || selectedQuarters.size) {
      const mHit = selectedMonths.has(monthOf(a));
      const qHit = selectedQuarters.has(quarterOf(a));
      if (!mHit && !qHit) return false;
    }
    if (selectedYears.size && !selectedYears.has(a.year)) return false;
    if (selectedSources.size && !selectedSources.has(sourceOf(a))) return false;
    if (selectedTypes.size && !selectedTypes.has(typeLabelOf(a))) return false;
    if (selectedWeeks.size && !selectedWeeks.has(weekOf(a))) return false;
    if (selectedStatuses.size) {
      const ud = userData[a.id] || {};
      const stLabel = ud.status === "watching" ? "追番中" : ud.status === "finished" ? "已看完" : ud.status === "abandoned" ? "已弃番" : "未标记";
      if (!selectedStatuses.has(stLabel)) return false;
    }
    if (searchTerm) {
      const kw = searchTerm.toLowerCase();
      return a.title.toLowerCase().includes(kw) || (a.tags || []).some(t => t.toLowerCase().includes(kw)) || (a.keywords || "").toLowerCase().includes(kw) || typeLabelOf(a).toLowerCase().includes(kw);
    }
    return true;
  });
}

function statusTag(a) {
  const s = userData[a.id] && userData[a.id].status;
  const map = {
    watching: ['tag-watching', '<i class="fa-solid fa-play"></i>追番中'],
    finished: ['tag-finished', '<i class="fa-solid fa-check"></i>已看完'],

    none: ['tag-none', '<i class="fa-regular fa-circle"></i>未标记']
  };
  const [cls, icon] = (s && map[s]) ? map[s] : map.none;
  return `<button class="tag ${cls} card-status-btn" onclick="openStatusMenu(event,'${a.id}')" title="点击设置追番状态">${icon}<i class="fa-solid fa-chevron-down" style="font-size:8px;opacity:.55;margin-left:3px;vertical-align:1px"></i></button>`;

function closeStatusMenu() { const m = $("statusMenu"); if (m) m.classList.remove("show"); }

function renderGrid() {

  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));

  $("clearBtn").classList.toggle("hidden", !hasFilter);

    renderPagination(total, totalPages);

  $("grid").innerHTML = pageList.map(a => {
    const ud = userData[a.id] || {};

          ${avg ? `<span class="text-[11px] text-amber-400"><i class="fa-solid fa-star mr-0.5"></i>${avg}</span>` : ""}
        </div>
        ${statusTag(a)}
        ${scoreBlocksHTML(ud, a)}
      </div>`;
  }).join("");
  renderPagination(total, totalPages);
}

/* 计算综合评分（开播前预期+完结加权） */
function calcAvg(scores) {
  if (!scores) return null;
  const nums = [];
  if (scores.open && scores.open.score) nums.push(scores.open.score);
  if (scores.final && scores.final.score) nums.push(scores.final.score);
  if (!nums.length) return null;
  return (nums.reduce((a, b) => a + b, 0) / nums.length).toFixed(1);
}

/* 区分显示三项评分：开播前预期 / 各集平均 / 完结（有分才显示） */
function scoreBlocksHTML(ud, a) {
  const parts = [];
  const open = ud.scores && ud.scores.open && ud.scores.open.score;
  const fin = ud.scores && ud.scores.final && ud.scores.final.score;
  const avgEp = epAvgOf(ud, a);
  if (open) parts.push(`<span class="score-chip" style="color:#c09a5b"><i class="fa-solid fa-flag-checkered mr-1"></i>开播前预期 ${open}</span>`);
  if (avgEp) parts.push(`<span class="score-chip" style="color:#8a9a6b"><i class="fa-solid fa-layer-group mr-1"></i>各集均 ${avgEp}</span>`);
  if (fin) parts.push(`<span class="score-chip" style="color:#5a7185"><i class="fa-solid fa-trophy mr-1"></i>完结 ${fin}</span>`);
  return parts.length ? `<div class="flex flex-wrap gap-1.5 mt-2">${parts.join("")}</div>` : "";
}

/* 参考完结分 = 开播前预期分×0.5 + 各集平均分×0.5 */
function finalPreview(ud, a) {
  const open = (ud.scores && ud.scores.open && ud.scores.open.score) || 0;
  const avgEp = epAvgOf(ud, a);
  if (!open && !avgEp) return null;
  return (open * 0.5 + (parseFloat(avgEp) || 0) * 0.5).toFixed(1);
}

/* ============================================================
 * 详情页
 * ============================================================ */
/* 制作阵容（动态岗位）：旧数据英文 key 转中文岗位名，支持任意自定义岗位 */
const STAFF_LABELS = { original: "原作", director: "导演", writer: "编剧", music: "音乐", studio: "制作公司", cast: "声优" };
/* 固定前排：原作、导演、制作公司优先展示，其余岗位保持原顺序 */
const STAFF_PRIORITY = ["original", "director", "studio"];
function staffHTML(a) {
  const st = a.staff || {};
  const entries = Object.entries(st).filter(([, v]) => Array.isArray(v) ? v.length : v !== undefined && v !== null && v !== "");
  if (!entries.length) return "";
  entries.sort((x, y) => {
    const px = STAFF_PRIORITY.indexOf(x[0]);
    const py = STAFF_PRIORITY.indexOf(y[0]);
    return (px === -1 ? STAFF_PRIORITY.length : px) - (py === -1 ? STAFF_PRIORITY.length : py);
  });
  const blocks = entries.map(([k, v]) => {
    const label = STAFF_LABELS[k] || k;
    const val = Array.isArray(v) ? v.join(" / ") : String(v);
    return `<div class="glass p-3"><div class="text-gray-500 mb-1">${label}</div><div>${val}</div></div>`;
  }).join("");
  return `<div class="text-xs mt-5">
    <div class="text-gray-400 mb-1 font-semibold">制作阵容</div>
    <div class="space-y-3">${blocks}</div>
  </div>`;
}
function openDetail(id) {
  const a = library.find(x => x.id === id);
  if (!a) return;
  currentAnime = a;
  // 记录当前筛选+排序列表中的位置，供详情左右导航使用
  detailList = sortAnime(filteredAnime());
  detailIndex = detailList.findIndex(x => x.id === a.id);
  const ud = userData[a.id] || {};
  detailScoreOpen = (ud.scores && ud.scores.open && ud.scores.open.score) || 0;
  detailCommentOpen = (ud.scores && ud.scores.open && ud.scores.open.comment) || "";
  detailScoreFinal = (ud.scores && ud.scores.final && ud.scores.final.score) || 0;
  detailCommentFinal = (ud.scores && ud.scores.final && ud.scores.final.comment) || "";
  detailCommentAbandoned = ud.abandonedComment || "";
  detailEditing = "";
  currentEp = 1; epScoreDraft = 0; epCommentDraft = "";
  closeStatusMenu();
  renderDetail();
  $("detailModal").classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeDetail() {
  $("detailModal").classList.remove("show");
  document.body.style.overflow = "";
}

/* 详情左右导航：按当前排序列表顺序切换上一部/下一部 */
function prevDetail() {
  const t = detailList[detailIndex - 1];
  if (t) openDetail(t.id);
}
function nextDetail() {
  const t = detailList[detailIndex + 1];
  if (t) openDetail(t.id);
}

function fmtScore(v) { v = Math.round((v || 0) * 2) / 2; return v % 1 ? v.toFixed(1) : String(v); }
function fmtStars(v) {
  v = Math.max(0, Math.round((v || 0) * 2) / 2);
  let h = "";
  for (let i = 0; i < Math.floor(v); i++) h += "★";
  if (v % 1) h += `<span class="half-star">★</span>`;
  return h;
}
function starsHTML(score, onChange, hintId) {
  let h = "";
  for (let i = 1; i <= 10; i++) {
    const full = score >= i;
    const half = !full && score >= i - 0.5;
    const cls = full ? "star active" : half ? "star half" : "star";
    h += `<span class="${cls}" title="${half ? (i - 0.5) + " 分" : i + " 分"}" onmouseenter="previewScore(${half ? i - 0.5 : i}, '${hintId}')" onmouseleave="clearScorePreview('${hintId}')" onclick="${onChange}(${i})">★</span>`;
  }
  h += `<span id="${hintId}" class="star-hint">${score ? fmtScore(score) + " 分" : "未评分"}</span>`;
  return h;
}
function previewScore(v, hintId) { const el = $(hintId); if (el) el.textContent = fmtScore(v) + " 分"; }
function clearScorePreview(hintId) {
  const el = $(hintId); if (!el) return;
  const draft = { openScoreHint: detailScoreOpen, finalScoreHint: detailScoreFinal, epScoreHint: epScoreDraft }[hintId];
  el.textContent = draft ? fmtScore(draft) + " 分" : "未评分";
}

function renderDetail() {
  const a = currentAnime;
  const ud = userData[a.id] || {};
  const st = ud.status || "";
  const s = ud.scores || {};
  const watched = (ud.episodes && ud.episodes[a.id] && ud.episodes[a.id].watched) || [];
  const epData = (ud.episodes && ud.episodes[a.id]) || {};

  let eps = "";
  for (let i = 1; i <= a.episodes; i++) {

    eps += `
      <div class="ep-row ${seen ? "checked" : ""}">

        <span class="text-[10px] text-gray-500 flex-none">${epAirDate(a, i)}</span>
        ${seen ? `
          <div class="flex-1 flex items-center gap-2 flex-wrap">
            <span class="text-amber-400 text-sm">${epScore ? fmtStars(epScore.score) + `<span style="color:#c8a25c;font-weight:700;margin-left:4px;font-size:13px">${fmtScore(epScore.score)} 分</span>` : `<span class="text-gray-500 cursor-pointer" onclick="epEditor(${i})"><i class="fa-regular fa-star mr-1"></i>去写短评</span>`}</span>
            ${epScore ? `<span class="text-xs text-gray-400 truncate flex-1">${epScore.comment || ""}</span><button class="text-xs text-indigo-300 hover:underline whitespace-nowrap" onclick="epEditor(${i})"><i class="fa-regular fa-pen-to-square mr-1"></i>编辑</button><button class="text-xs text-rose-300 hover:underline whitespace-nowrap" onclick="removeEpScore(${i})"><i class="fa-regular fa-trash-can mr-1"></i>删除</button><span style="cursor:pointer;color:#7c86b4;font-size:12px;white-space:nowrap" title="查看其他用户对本集评分" data-anime="${a.id}" data-type="ep" data-ep="${i}" onclick="DpccaReviewWall.openBy(this)"><i class="fa-regular fa-comment-dots mr-1"></i><span class="rw-num">…</span></span>` : ""}
          </div>` : `<span class="text-xs text-gray-500">看完后可评分</span>`}
      </div>`;
  }

  $("detailBody").innerHTML = `
    <div class="flex items-center justify-center gap-4 px-12 mb-4">
      <button class="btn btn-ghost" onclick="prevDetail()" ${detailIndex <= 0 ? "disabled" : ""}><i class="fa-solid fa-chevron-left"></i> 上一部</button>
      <span class="text-xs text-gray-400 whitespace-nowrap">${detailIndex + 1} / ${detailList.length}</span>
      <button class="btn btn-ghost" onclick="nextDetail()" ${detailIndex >= detailList.length - 1 ? "disabled" : ""}>下一部 <i class="fa-solid fa-chevron-right"></i></button>
    </div>
    <div class="flex flex-col md:flex-row gap-6">
      <div class="md:w-72 flex-none">
        <div class="rounded-2xl aspect-[4/5] mb-4 overflow-hidden">${coverHTML(a, "72px")}</div>
        <div class="flex flex-wrap gap-2 mb-3">
          ${a.tags.map(t => `<span class="tag">#${t}</span>`).join("")}
        </div>
        <div class="text-xs text-gray-400 space-y-1.5 mb-4">
          <div><i class="fa-solid fa-calendar mr-2 w-4 text-indigo-400"></i>${dateStr(a)}</div>
          <div><i class="fa-solid fa-calendar-week mr-2 w-4 text-indigo-400"></i>更新星期 · ${weekStr(a)}</div>
          <div><i class="fa-solid fa-clapperboard mr-2 w-4 text-indigo-400"></i>全 ${a.episodes} 集</div>
          <div><i class="fa-solid fa-book mr-2 w-4 text-indigo-400"></i>来源 · ${sourceOf(a)}</div>
          <div><i class="fa-solid fa-film mr-2 w-4 text-indigo-400"></i>类型 · ${typeLabelOf(a)}</div>
        </div>
        <div class="space-y-2">
          <div class="text-xs text-gray-400 mb-1 font-semibold">追番状态</div>
          ${["watching","finished","abandoned"].map(s2 => `
            <button class="btn w-full justify-start ${st === s2 ? "btn-primary" : "btn-ghost"}" onclick="setStatus('${s2}')">
              ${s2 === "watching" ? '<i class="fa-solid fa-play"></i>' : s2 === "finished" ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-flag"></i>'}
              ${s2 === "watching" ? "追番中" : s2 === "finished" ? "已看完" : "已弃番"}
            </button>`).join("")}
        </div>
        ${staffHTML(a)}
      </div>
      <div class="flex-1 min-w-0">
        <h2 id="dpccaDetailTitle" class="text-2xl font-bold mb-1">${a.title}</h2>
        <p class="text-gray-400 text-sm leading-relaxed mb-4">${a.desc}</p>
        <p class="text-xs -mt-2 mb-4" style="color:#a08e76"><i class="fa-solid fa-circle-info mr-1 opacity-70"></i>资料有误或想提建议？<button type="button" onclick="Feedback.openForAnime('${a.id}')" style="background:none;border:none;padding:0;cursor:pointer;color:#a8732f;border-bottom:1px dashed #a8732f;margin-left:3px">点此反馈</button></p>

        <!-- 开播前预期分 -->
        <div class="glass p-4 mb-4">
          <div class="font-semibold mb-3"><i class="fa-solid fa-flag-checkered mr-2 text-indigo-400"></i>开播前预期分</div>
          <div class="mb-3">${scoreAreaHTML("open")}</div>
          <div class="flex items-center justify-between mt-2 pt-2 border-t border-white/5 text-xs">
            <span class="text-gray-400"><i class="fa-solid fa-comments mr-1"></i>开播评分墙 · <b class="rw-num" style="color:#c09a5b">…</b> 人已评</span>
            <button type="button" data-anime="${a.id}" data-type="open" data-ep="0" onclick="DpccaReviewWall.openBy(this)" style="background:none;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:#a5b4fc;font-size:12px">查看更多评论 <i class="fa-solid fa-angle-right"></i></button>
          </div>
        </div>

        <!-- 单集评分 -->
        <div class="glass p-4 mb-4">
          <div class="font-semibold mb-3"><i class="fa-solid fa-list mr-2 text-indigo-400"></i>单集评分</div>
          <div class="space-y-2">${eps}</div>
        </div>

        <!-- 弃番评论：仅在状态 = 已弃番时显示，置于完结评分之前 -->
        ${st === "abandoned" ? abandonBlockHTML() : ""}

        <!-- 完结评分 -->
        <div class="glass p-4 ${finalLocked ? "" : "opacity-50"}">
          <div class="font-semibold mb-1"><i class="fa-solid fa-trophy mr-2 text-indigo-400"></i>完结评分</div>
          <p class="text-xs text-gray-500 mb-3">${finalLocked ? "已解锁，可以打分啦！" : `看完全部 ${a.episodes} 集后解锁（当前 ${watched.length}/${a.episodes}）`}</p>
          ${finalPreview(ud, a) ? `<div class="text-xs mb-3 py-1.5 px-3 rounded-lg bg-white/5 border border-dashed" style="color:#a8988a"><i class="fa-solid fa-calculator mr-1"></i>参考完结分：<b style="color:#c09a5b">${finalPreview(ud, a)}</b>（开播前预期分×0.5 + 各集平均分×0.5）</div>` : ""}
          ${finalLocked ? `<div class="mb-3">${scoreAreaHTML("final")}</div>` : `<div class="text-sm text-gray-500 flex items-center gap-2"><i class="fa-solid fa-lock"></i> 锁定中</div>`}
          <div class="flex items-center justify-between mt-2 pt-2 border-t border-white/5 text-xs">
            <span class="text-gray-400"><i class="fa-solid fa-comments mr-1"></i>完结评分墙 · <b class="rw-num" style="color:#c09a5b">…</b> 人已评</span>
            <button type="button" data-anime="${a.id}" data-type="final" data-ep="0" onclick="DpccaReviewWall.openBy(this)" style="background:none;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:#a5b4fc;font-size:12px">查看更多评论 <i class="fa-solid fa-angle-right"></i></button>
          </div>
        </div>

        <!-- 操作 -->
        <div class="flex gap-3 mt-5">
          <button class="btn btn-primary" onclick="openShare()"><i class="fa-solid fa-image"></i> 生成分享卡片</button>
          <button class="btn" onclick="closeDetail()">关闭</button>
        </div>
      </div>
    </div>`;
  if (window.DpccaReviewWall) window.DpccaReviewWall.refreshAll(a.id);
}

function escapeAttr(s) { return (s || "").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

/* 单集编辑器 */
function epEditor(i) {
  const existing = $("epEditorBox");
  if (existing) {
    if (currentEp === i) { removeEpEditor(); return; }
    removeEpEditor();
  }
  currentEp = i;
  const ud = userData[currentAnime.id] || {};
  const epScores = (ud.episodes && ud.episodes[currentAnime.id] && ud.episodes[currentAnime.id].epScores) || {};
  epScoreDraft = (epScores[i] && epScores[i].score) || 0;
  epCommentDraft = (epScores[i] && epScores[i].comment) || "";
  const row = document.createElement("div");
  row.id = "epEditorBox";
  row.className = "glass p-4 mb-3 border-indigo-500/40";
  row.innerHTML = `
    <div class="font-semibold text-sm mb-2">EP${i} 评分</div>
    <div id="epStars" class="flex gap-1 mb-2 items-center flex-wrap">${starsHTML(epScoreDraft, "setEpScore", "epScoreHint")}</div>
    <input id="epComment" type="text" placeholder="单集短评…" value="${escapeAttr(epCommentDraft)}" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm outline-none focus:border-indigo-500/60 mb-2">
    <div class="flex gap-2">
      <button class="btn btn-primary" onclick="saveEpScore()"><i class="fa-solid fa-floppy-disk"></i>保存</button>
      <button class="btn btn-ghost" onclick="removeEpEditor()">取消</button>
    </div>`;
  const target = [...document.querySelectorAll(".ep-row")].find(r => r.textContent.includes(`EP${i}`));
  if (target) target.after(row);
  else $("detailBody").querySelector(".glass.p-4 .space-y-2").appendChild(row);
}
function removeEpEditor() { const b = $("epEditorBox"); if (b) b.remove(); }
function setOpenScore(v) { detailScoreOpen = detailScoreOpen === v ? v - 0.5 : v; renderStars("openStars", detailScoreOpen); }
function setFinalScore(v) { detailScoreFinal = detailScoreFinal === v ? v - 0.5 : v; renderStars("finalStars", detailScoreFinal); }
function setEpScore(v) { epScoreDraft = epScoreDraft === v ? v - 0.5 : v; renderStars("epStars", epScoreDraft); }
function renderStars(id, v) {
  const el = $(id); if (!el) return;
  const hintId = id === "openStars" ? "openScoreHint" : id === "finalStars" ? "finalScoreHint" : "epScoreHint";
  el.innerHTML = starsHTML(v, id === "openStars" ? "setOpenScore" : id === "finalStars" ? "setFinalScore" : "setEpScore", hintId);
}

/* 状态切换 */
async function setStatus(s) {
  const id = currentAnime.id;
  userData[id] = userData[id] || {};
  if (s === "finished") {
    // 选「已看完」自动勾选全部集数 → 完结评分自动解锁
    userData[id].episodes = userData[id].episodes || {};
    userData[id].episodes[id] = userData[id].episodes[id] || {};
    const d = userData[id].episodes[id];
    d.watched = d.watched || [];
    for (let i = 1; i <= currentAnime.episodes; i++) if (!d.watched.includes(i)) d.watched.push(i);
  }
  userData[id].status = s;
  // 离开「已弃番」状态时清除弃番评论编辑态，避免下次切回闪现编辑框
  if (s !== "abandoned" && detailEditing === "abandon") detailEditing = "";
  await persist();
  renderDetail(); renderGrid();
  toast(s === "watching" ? "已设为追番中" : s === "finished" ? "已看完：全部集数已勾选，完结评分已解锁" : "已设为已弃番");
}

/* 单集勾选 */
async function toggleEp(i) {
  const id = currentAnime.id;
  userData[id] = userData[id] || {};
  userData[id].episodes = userData[id].episodes || {};
  userData[id].episodes[id] = userData[id].episodes[id] || {};
  const d = userData[id].episodes[id];
  d.watched = d.watched || [];
  const idx = d.watched.indexOf(i);
  if (idx >= 0) d.watched.splice(idx, 1); else d.watched.push(i);
  // 全部看完：撒花 + 自动已看完
  if (d.watched.length >= currentAnime.episodes) {
    userData[id].status = "finished";
    if (detailEditing === "abandon") detailEditing = "";
    await persist();
    renderDetail(); renderGrid();
    showConfetti(id);
  } else {
    if (userData[id].status === "finished") userData[id].status = "watching";
    // 离开「已弃番」状态时同步清除弃番评论编辑态
    if (userData[id].status !== "abandoned" && detailEditing === "abandon") detailEditing = "";
    await persist();
    renderDetail();
  }
}

/* ---------- 开播/完结评分三态组件：去写短评 → 保存 → 编辑/删除 ---------- */
function _escHtml(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ============================================================
 * v3.0 评论框组件：加宽 + 自动换行 + 右下角点击放大/还原
 * （「单集短评」保持原样，不使用该组件）
 * ============================================================ */
function cmtBoxHTML(id, placeholder, value, wrapCls) {
  return `<div class="cmt-wrap ${wrapCls || "mb-3"}">
    <textarea id="${id}" rows="1" placeholder="${placeholder}" class="cmt-area bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm outline-none focus:border-indigo-500/60" oninput="autoGrow('${id}')">${_escHtml(value)}</textarea>
    <button type="button" class="cmt-grow" title="点击放大 / 还原评论框" onclick="cmtToggle('${id}')"><i class="fa-solid fa-up-right-and-down-left-from-center"></i></button>
  </div>`;
}

/* 随内容自动增高（上限由 .grown 状态决定：默认 170px / 放大后 420px） */
function autoGrow(id) {
  const el = $(id);
  if (!el) return;
  const wrap = el.closest ? el.closest(".cmt-wrap") : null;
  const max = wrap && wrap.classList.contains("grown") ? 420 : 170;
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight + 2, max) + "px";
}

/* 右下角按钮：在「放大」与「还原」之间切换 */
function cmtToggle(id) {
  const el = $(id);
  if (!el) return;
  const wrap = el.closest ? el.closest(".cmt-wrap") : null;
  if (wrap) wrap.classList.toggle("grown");
  autoGrow(id);
  const btn = wrap && wrap.querySelector(".cmt-grow");
  if (btn) {
    btn.innerHTML = wrap.classList.contains("grown")
      ? '<i class="fa-solid fa-down-left-and-up-right-to-center"></i>'
      : '<i class="fa-solid fa-up-right-and-down-left-from-center"></i>';
  }
}

/* 渲染开播/完结评分区域：空态 CTA / 编辑态 / 已保存态（保存后收起为 编辑+删除） */
function scoreAreaHTML(kind) {
  const s = ((userData[currentAnime.id] || {}).scores || {})[kind];
  const saved = s && s.score;
  const isEdit = detailEditing === kind;
  const isOpen = kind === "open";
  const starId = isOpen ? "openStars" : "finalStars";
  const setFn = isOpen ? "setOpenScore" : "setFinalScore";
  const hintId = isOpen ? "openScoreHint" : "finalScoreHint";
  const cmtId = isOpen ? "openComment" : "finalComment";
  const draftScore = isOpen ? detailScoreOpen : detailScoreFinal;
  const draftCmt = isOpen ? detailCommentOpen : detailCommentFinal;
  if (isEdit) {
    return `
      <div id="${kind}Editor">
        <div id="${starId}" class="flex gap-1 mb-3 items-center flex-wrap">${starsHTML(draftScore, setFn, hintId)}</div>
        ${cmtBoxHTML(cmtId, isOpen ? "写下开播前预期短评…（可自动换行，点右下角放大）" : "写完结总评…（可自动换行，点右下角放大）", draftCmt)}
        <div class="flex gap-2">
          <button class="btn btn-primary" onclick="saveScore('${kind}')"><i class="fa-solid fa-floppy-disk"></i> 保存</button>
          <button class="btn btn-ghost" onclick="cancelScore('${kind}')">取消</button>
        </div>
      </div>`;
  }
  if (!saved) {
    return `
      <div class="flex items-center gap-2 flex-wrap">
        <button class="btn btn-primary" onclick="beginScore('${kind}')"><i class="fa-regular fa-star mr-1"></i>去写短评</button>
        <span class="text-xs text-gray-500">${isOpen ? "开播前的期待，一句话即可同步公开" : "追完的最终评价，一句话即可同步公开"}</span>
      </div>`;
  }
  const hasCmt = !!(s.comment && String(s.comment).trim());
  return `
    <div class="rounded-xl border border-white/10 bg-white/5 p-3">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-amber-400 text-sm">${fmtStars(s.score)} <span style="color:#c8a25c;font-weight:700;margin-left:4px;font-size:13px">${fmtScore(s.score)} 分</span></span>
        <span class="text-[10px] px-1.5 py-0.5 rounded-full" style="background:rgba(52,211,153,.14);color:#5eead4">已同步</span>
      </div>
      ${hasCmt ? `<div class="text-sm text-gray-300 mt-1.5 break-words">${_escHtml(s.comment)}</div>` : `<div class="text-[11px] text-gray-500 mt-1.5">未填写短评，评分仍会同步展示在公开墙与管理后台</div>`}
      <div class="flex items-center gap-3 mt-2">
        <button class="text-xs text-indigo-300 hover:underline whitespace-nowrap" onclick="beginScore('${kind}')"><i class="fa-regular fa-pen-to-square mr-1"></i>编辑</button>
        <button class="text-xs text-rose-300 hover:underline whitespace-nowrap" onclick="removeScore('${kind}')"><i class="fa-regular fa-trash-can mr-1"></i>删除</button>
      </div>
    </div>`;
}

function beginScore(kind) {
  const s = ((userData[currentAnime.id] || {}).scores || {})[kind] || {};
  if (kind === "open") { detailScoreOpen = s.score || 0; detailCommentOpen = s.comment || ""; }
  else { detailScoreFinal = s.score || 0; detailCommentFinal = s.comment || ""; }
  detailEditing = kind;
  renderDetail();
  setTimeout(function () {
    const el = $(kind === "open" ? "openComment" : "finalComment");
    if (el) { el.focus(); autoGrow(el.id); }
  }, 60);
}
function cancelScore(kind) { if (detailEditing === kind) detailEditing = ""; renderDetail(); }

async function saveScore(kind) {
  const id = currentAnime.id;
  const comment = String($(kind === "open" ? "openComment" : "finalComment").value || "").trim();
  const score = kind === "open" ? detailScoreOpen : detailScoreFinal;
  if (!score) { toast(kind === "open" ? "请先选择开播前预期分" : "请先选择完结评分", true); return; }
  userData[id] = userData[id] || {};
  userData[id].scores = userData[id].scores || {};
  userData[id].scores[kind] = { score: score, comment: comment };
  detailEditing = "";
  await persist();
  renderDetail(); renderGrid();
  if (window.DpccaReviewWall) {
    window.DpccaReviewWall.pushRating(id, currentAnime.title, kind, "0", score, comment);
    window.DpccaReviewWall.refreshAll(id);
  }
  toast("已保存" + (kind === "open" ? "开播前预期分" : "完结评分"));
}

async function removeScore(kind) {
  const id = currentAnime.id;
  const label = kind === "open" ? "开播前预期分" : "完结评分";
  if (!confirm("删除这条" + label + "？\n评分与短评都会被移除，公开墙与管理后台也会同步移除该记录。")) return;
  const ud = userData[id] || {};
  if (ud.scores) delete ud.scores[kind];
  if (kind === "open") { detailScoreOpen = 0; detailCommentOpen = ""; } else { detailScoreFinal = 0; detailCommentFinal = ""; }
  detailEditing = "";
  await persist();
  renderDetail(); renderGrid();
  if (window.DpccaReviewWall) {
    window.DpccaReviewWall.pushRating(id, currentAnime.title, kind, "0", 0, "");
    window.DpccaReviewWall.refreshAll(id);
  }
  toast("已删除" + label);
}

/* ---------- 弃番评论组件：与开播/完结评分同一套三态交互（去写 → 保存 → 编辑/删除），
 * 仅存于用户自身追番档案（userData.abandonedComment），不推送到公开评分墙 ---------- */
function abandonBlockHTML() {
  const ud = userData[currentAnime.id] || {};
  const cmt = String(ud.abandonedComment || "").trim();
  const isEdit = detailEditing === "abandon";
  let body = "";
  if (isEdit) {
    body = `
      <div id="abandonEditor">
        ${cmtBoxHTML("abandonComment", "写下弃番原因或一句吐槽…（可自动换行，点右下角放大）", detailCommentAbandoned)}
        <div class="flex gap-2">
          <button class="btn btn-primary" onclick="saveAbandonComment()"><i class="fa-solid fa-floppy-disk"></i> 保存</button>
          <button class="btn btn-ghost" onclick="cancelAbandonComment()">取消</button>
        </div>
      </div>`;
  } else if (!cmt) {
    body = `
      <div class="flex items-center gap-2 flex-wrap">
        <button class="btn btn-primary" onclick="beginAbandonComment()"><i class="fa-regular fa-comment mr-1"></i>去写评论</button>
        <span class="text-xs text-gray-500">记录弃番原因，仅保存在你的追番档案中</span>
      </div>`;
  } else {
    body = `
      <div class="rounded-xl border border-white/10 bg-white/5 p-3">
        <div class="text-sm text-gray-300 break-words">${_escHtml(cmt)}</div>
        <div class="flex items-center gap-3 mt-2">
          <button class="text-xs text-indigo-300 hover:underline whitespace-nowrap" onclick="beginAbandonComment()"><i class="fa-regular fa-pen-to-square mr-1"></i>编辑</button>
          <button class="text-xs text-rose-300 hover:underline whitespace-nowrap" onclick="removeAbandonComment()"><i class="fa-regular fa-trash-can mr-1"></i>删除</button>
        </div>
      </div>`;
  }
  return `
    <div class="glass p-4 mb-4 drop-in">
      <div class="font-semibold mb-1"><i class="fa-solid fa-flag mr-2 text-rose-400"></i>弃番评论</div>
      <p class="text-xs text-gray-500 mb-3">已弃番，在这里记下弃番原因，方便日后回看</p>
      <div>${body}</div>
    </div>`;
}
function beginAbandonComment() {
  detailCommentAbandoned = (userData[currentAnime.id] || {}).abandonedComment || "";
  detailEditing = "abandon";
  renderDetail();
  setTimeout(function () { const el = $("abandonComment"); if (el) { el.focus(); autoGrow(el.id); } }, 60);
}
function cancelAbandonComment() { if (detailEditing === "abandon") detailEditing = ""; renderDetail(); }
async function saveAbandonComment() {
  const el = $("abandonComment");
  const comment = String(el ? el.value : "").trim();
  if (!comment) { toast("请先写下弃番评论", true); return; }
  const id = currentAnime.id;
  userData[id] = userData[id] || {};
  userData[id].abandonedComment = comment;
  detailCommentAbandoned = comment;
  detailEditing = "";
  await persist();
  renderDetail(); renderGrid();
  toast("弃番评论已保存");
}
async function removeAbandonComment() {
  if (!confirm("删除这条弃番评论？")) return;
  const id = currentAnime.id;
  if (userData[id]) delete userData[id].abandonedComment;
  detailCommentAbandoned = "";
  detailEditing = "";
  await persist();
  renderDetail(); renderGrid();
  toast("已删除弃番评论");
}

/* 删除某集评分（分数+短评一并移除，公开墙与管理后台同步删除该墙行） */
async function removeEpScore(ep) {
  const id = currentAnime.id;
  if (!confirm("删除 EP" + ep + " 的评分与短评？\n公开墙与管理后台会同步移除该记录。")) return;
  userData[id] = userData[id] || {};
  userData[id].episodes = userData[id].episodes || {};
  userData[id].episodes[id] = userData[id].episodes[id] || {};
  const epObj = userData[id].episodes[id];
  if (epObj.epScores) delete epObj.epScores[ep];
  await persist();
  renderDetail(); renderGrid();
  if (window.DpccaReviewWall) {
    window.DpccaReviewWall.pushRating(id, currentAnime.title, "ep", String(ep), 0, "");
    window.DpccaReviewWall.refreshAll(id);
  }
  toast("已删除 EP" + ep + " 评分");
}

/* 保存单集评分 */
async function saveEpScore() {
  if (!epScoreDraft) { toast("请先选择分数", true); return; }
  const id = currentAnime.id;
  userData[id] = userData[id] || {};
  userData[id].episodes = userData[id].episodes || {};
  userData[id].episodes[id] = userData[id].episodes[id] || {};
  userData[id].episodes[id].epScores = userData[id].episodes[id].epScores || {};
  userData[id].episodes[id].epScores[currentEp] = { score: epScoreDraft, comment: $("epComment").value.trim() };
  await persist();
  removeEpEditor();
  renderDetail();
  if (window.DpccaReviewWall) window.DpccaReviewWall.pushRating(id, currentAnime.title, "ep", String(currentEp), epScoreDraft, $("epComment").value.trim());
  toast("单集评分已保存");
}

/* 持久化（走 dataProvider） */
async function persist() {
  try { await dataProvider.saveUserData(userData); }
  catch (e) { console.warn("保存失败", e); toast("云端保存失败，已缓存在本地", true); }
}

/* ============================================================
 * 完结撒花
 * ============================================================ */
function showConfetti(animeId) {
  if (confettiShown.has(animeId)) { $("confettiModal").classList.add("show"); return; }
  confettiShown.add(animeId);
  const layer = $("confettiLayer");
  layer.innerHTML = "";
  const colors = ["#d4c4a8", "#c0a880", "#a5b28a", "#c09a5b", "#c79a8a", "#8a9a6b"];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = Math.random() * 1.2 + "s";
    c.style.animationDuration = 2.5 + Math.random() * 2 + "s";
    layer.appendChild(c);
  }
  $("confettiModal").classList.add("show");
}
function closeConfetti() { $("confettiModal").classList.remove("show"); }

/* ============================================================
 * 一图流分享卡片
 * ============================================================ */
let shareCardMode = "simple";

function setShareMode(mode) {
  shareCardMode = mode;
  renderShareCard();
}

function openShare() {
  shareCardMode = "simple";
  renderShareCard();
  $("shareModal").classList.add("show");
}
function closeShare() { $("shareModal").classList.remove("show"); }

function renderShareCard() {
  const a = currentAnime;
  const ud = userData[a.id] || {};
  const st = ud.status || "未标记";
  const stMap = { watching: "追番中", finished: "已看完", abandoned: "已弃番" };
  const avg = calcAvg(ud.scores);
  const watched = (ud.episodes && ud.episodes[a.id] && ud.episodes[a.id].watched) || [];
  const open = (ud.scores && ud.scores.open) || null;
  const fin = (ud.scores && ud.scores.final) || null;
  const epScores = (ud.episodes && ud.episodes[a.id] && ud.episodes[a.id].epScores) || {};
  const epAvg = epAvgOf(ud, a);

  const simpleHTML = `
    <div class="cover-big overflow-hidden">${coverHTML(a, "72px")}</div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <h2>${a.title}</h2>
      ${avg ? `<div style="font-size:26px;font-weight:800;color:#c09a5b">${avg}<span style="font-size:13px;color:#a8988a"> 分</span></div>` : ""}
    </div>
    <div class="meta">${dateStr(a)} · ${a.episodes}集 · ${watched.length}/${a.episodes} 已看</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <span class="tag" style="color:${st === "追番中" ? "#5f7350" : st === "已看完" ? "#5a7185" : "#b06a5a"}">${stMap[st] || st}</span>
      ${a.tags.map(t => `<span class="tag">#${t}</span>`).join("")}
    </div>
    <div style="background:#efe7d9;border-radius:12px;padding:12px;font-size:13px;line-height:1.8">
      ${open ? `<div><b style="color:#c09a5b">开播前预期 ${fmtStars(open.score)} ${open.score}</b>${open.comment ? `<div style="color:#a8988a">${escapeAttr(open.comment)}</div>` : ""}</div>` : ""}
      ${epAvg ? `<div><b style="color:#8a9a6b">各集平均 ${epAvg}</b></div>` : ""}
      ${fin ? `<div><b style="color:#5a7185">完结 ${fmtStars(fin.score)} ${fin.score}</b>${fin.comment ? `<div style="color:#a8988a">${escapeAttr(fin.comment)}</div>` : ""}</div>` : ""}
      ${!open && !fin && !epAvg ? `<div style="color:#a8988a">还没有评分，快来为这部番打分吧！</div>` : ""}
    </div>
    <div style="margin-top:14px;font-size:11px;color:#b3a08e;display:flex;justify-content:space-between;align-items:center">
      <span>DPCCA 追番评分库</span><span>${new Date().toLocaleDateString()}</span>
    </div>`;

  const staff = a.staff || {};
  const staffItems = [
    staff.original && `原作：${staff.original}`,
    staff.director && `导演：${staff.director}`,
    staff.writer && `脚本：${staff.writer}`,
    staff.music && `音乐：${staff.music}`,
    staff.studio && `制作：${staff.studio}`,
    staff.cast && staff.cast.length && `声优：${staff.cast.join("、")}`
  ].filter(Boolean);

  const epChips = [];
  for (let i = 1; i <= a.episodes; i++) {
    const es = epScores[i];
    if (es && es.score) {
      epChips.push(`<div class="share-ep-chip"><b>EP${i}</b> ${fmtStars(es.score)} ${es.score}${es.comment ? `<div style="color:#7a6857;margin-top:2px">${escapeAttr(es.comment)}</div>` : ""}</div>`);
    }
  }

  const detailHTML = `
    <div style="display:flex;gap:16px;align-items:flex-start">
      <div class="cover-big overflow-hidden" style="width:130px;flex:none;margin:0;font-size:48px">${coverHTML(a, "48px")}</div>
      <div style="flex:1;min-width:0">
        <h2 style="margin-top:0">${a.title}</h2>
        <div class="meta">${sourceOf(a)} · ${typeLabelOf(a)} · ${a.episodes}集 · ${dateStr(a)} · ${weekStr(a)}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
          <span class="tag" style="color:${st === "追番中" ? "#5f7350" : st === "已看完" ? "#5a7185" : "#b06a5a"}">${stMap[st] || st}</span>
          ${a.tags.map(t => `<span class="tag">#${t}</span>`).join("")}
        </div>
        ${avg ? `<div style="font-size:22px;font-weight:800;color:#c09a5b">${avg}<span style="font-size:12px;color:#a8988a"> 分</span></div>` : ""}
      </div>
    </div>
    ${a.desc ? `<div class="share-desc">${escapeAttr(a.desc)}</div>` : ""}
    ${staffItems.length ? `<div class="share-staff">${staffItems.map(x => `<span style="margin-right:10px">${x}</span>`).join("")}</div>` : ""}
    <div style="margin:8px 0 12px;font-size:12px;color:#7a6857">已看进度：${watched.length}/${a.episodes} 集</div>
    <div class="share-section">
      <div class="share-section-title">评分详情</div>
      ${open ? `<div class="share-score-row"><b style="color:#c09a5b">开播前预期 ${fmtStars(open.score)} ${open.score}</b>${open.comment ? `<div class="share-comment" style="margin-top:2px">${escapeAttr(open.comment)}</div>` : ""}</div>` : ""}
      ${epAvg ? `<div class="share-score-row"><b style="color:#8a9a6b">各集平均 ${epAvg}</b></div>` : ""}
      ${epChips.length ? `<div class="share-ep-grid" style="margin-top:8px">${epChips.join("")}</div>` : ""}
      ${fin ? `<div class="share-score-row" style="margin-top:8px"><b style="color:#5a7185">完结 ${fmtStars(fin.score)} ${fin.score}</b>${fin.comment ? `<div class="share-comment" style="margin-top:2px">${escapeAttr(fin.comment)}</div>` : ""}</div>` : ""}
      ${!open && !fin && !epAvg ? `<div style="color:#a8988a;font-size:12px">还没有评分，快来为这部番打分吧！</div>` : ""}
    </div>
    <div style="margin-top:14px;font-size:11px;color:#b3a08e;display:flex;justify-content:space-between;align-items:center">
      <span>DPCCA 追番评分库</span><span>${new Date().toLocaleDateString()}</span>
    </div>`;

  $("shareCard").innerHTML = shareCardMode === "detail" ? detailHTML : simpleHTML;

  const simpleBtn = $("shareSimpleBtn");
  const detailBtn = $("shareDetailBtn");
  if (simpleBtn) {
    simpleBtn.classList.toggle("btn-primary", shareCardMode === "simple");
    simpleBtn.classList.toggle("btn-ghost", shareCardMode !== "simple");
  }
  if (detailBtn) {
    detailBtn.classList.toggle("btn-primary", shareCardMode === "detail");
    detailBtn.classList.toggle("btn-ghost", shareCardMode !== "detail");
  }
}

async function downloadShare() {
  const el = $("shareCard");
  try {
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: null, useCORS: true });
    const link = document.createElement("a");
    link.download = `DPCCA_${currentAnime.title}_分享卡片.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
    toast("分享卡片已下载");
  } catch (e) {
    console.error(e);
    toast("导出失败，请重试", true);
  }
}

/* ============================================================
 * 初始化
 * ============================================================ */
async function init() {
  // 初始化番剧库（云端拉取失败自动回退本地内置数据）
  try {
    library = await dataProvider.initAnimeData();
  } catch (e) {
    console.warn("云端番剧库加载失败，使用本地数据", e);
    library = ANIME_LIBRARY;
  }
  // 加载用户数据（云端失败回退空数据，不影响浏览）
  try {
    userData = await dataProvider.loadUserData();
  } catch (e) {
    console.warn("云端用户数据加载失败，使用空数据", e);
    userData = {};
  }
  renderYearTabs();
  renderSeasonTabs();
  renderQuarterTabs();
  renderWeekTabs();
  renderSourceTabs();
  renderTypeTabs();
  renderStatusTabs();
  renderSortBar();
  renderGrid();
  updateCloudBadge();
  healWallMissing();

  // 移动端：默认收起筛选面板，避免首屏被筛选占据
  if (window.innerWidth < 768) {
    const fp = $("filterPanel");
    if (fp) fp.removeAttribute("open");
  }

  // 搜索
  $("searchInput").addEventListener("input", (e) => {
    searchTerm = e.target.value.trim();
    currentPage = 1;
    renderGrid();
  });
  // 弹窗背景点击关闭
  document.querySelectorAll(".modal-overlay").forEach(ov => {
    ov.addEventListener("click", (e) => {
      if (e.target !== ov) return;
      ov.classList.remove("show");
      document.body.style.overflow = "";
    });
  });
  // 点击卡片状态菜单外部任意处关闭
  document.addEventListener("click", (e) => {
    const menu = $("statusMenu");
    if (menu && menu.classList.contains("show") && !menu.contains(e.target)) closeStatusMenu();
  });
}

/* 三端同步自愈：注册用户每次进入页面补同步缺失/不一致的墙行（会话内至多一次，延迟执行，由 reviews_api rebuild 幂等补齐） */
function healWallMissing() {
  try {
    var rw = window.DpccaReviewWall;
    if (!rw || typeof rw.isRegistered !== "function" || !rw.isRegistered() || typeof rw.rebuildOnce !== "function") return;
    var uid = "";
    try { uid = String(rw.getUid ? rw.getUid() : ""); } catch (e) { /* ignore */ }
    if (!/^D\d+$/.test(uid)) return;
    var k = "dpcca_rw_heal_" + uid;
    try { if (sessionStorage.getItem(k)) return; } catch (e) { /* ignore */ }
    setTimeout(function () {
      try {
        var pr = rw.rebuildOnce(true, true);
        if (pr && typeof pr.then === "function") {
          pr.then(function (res) {
            if (res && res.ok) { try { sessionStorage.setItem(k, "1"); } catch (e) { /* ignore */ } }
          });
        } else {
          try { sessionStorage.setItem(k, "1"); } catch (e) { /* ignore */ }
        }
      } catch (e) { /* ignore */ }
    }, 1200);
  } catch (e) { /* 忽略 */ }
}

init();
